defaults: [base]

experiment_name: text_only_ravdess_si
dataset: ravdess
modality: text

model:
  type: text_only
  text_encoder: roberta-base
  freeze_encoder_layers: 0
  dropout: 0.1
  num_classes: 8

data:
  data_dir: data/ravdess
  split_strategy: speaker_independent
  test_actors: [21, 22, 23, 24]
  val_actors: [19, 20]
  batch_size: 32

trainer:
  max_epochs: 20

optimizer:
  lr: 2.0e-5
