defaults: [base]

experiment_name: audio_only_ravdess
dataset: ravdess
modality: audio

model:
  type: audio_only
  audio_encoder: facebook/wav2vec2-base
  freeze_feature_extractor: true
  # Freeze the bottom 8 of 12 transformer layers — only fine-tune the top 4.
  # This is the standard recipe for fine-tuning SSL speech models on small datasets.
  freeze_encoder_layers: 8
  pooling: mean
  dropout: 0.2
  num_classes: 8

data:
  data_dir: data/ravdess
  split_seed: 42
  test_size: 0.2
  val_size: 0.1
  batch_size: 8
  max_audio_seconds: 5.0

trainer:
  max_epochs: 30
  accumulate_grad_batches: 2

optimizer:
  # Conservative LR — wav2vec2 fine-tuning sweet spot is 1e-5 to 5e-5.
  # 1e-4 (the previous value) is the *pre-training* LR, which is way too high here.
  lr: 2.0e-5
  weight_decay: 0.01

scheduler:
  name: linear_warmup
  warmup_ratio: 0.1

loss:
  use_class_weights: true   # Helps with calm/neutral imbalance in 8-class RAVDESS
