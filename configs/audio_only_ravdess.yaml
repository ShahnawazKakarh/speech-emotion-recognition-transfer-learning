defaults: [base]

experiment_name: audio_only_ravdess
dataset: ravdess
modality: audio

model:
  type: audio_only
  audio_encoder: facebook/wav2vec2-base
  freeze_feature_extractor: true
  freeze_encoder_layers: 0
  pooling: mean
  dropout: 0.1
  num_classes: 8

data:
  data_dir: data/ravdess
  split_seed: 42
  test_size: 0.2
  val_size: 0.1
  batch_size: 8
  max_audio_seconds: 5.0

trainer:
  max_epochs: 15
  accumulate_grad_batches: 2

optimizer:
  lr: 1.0e-4
