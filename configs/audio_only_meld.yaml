defaults: [base]

experiment_name: audio_only_meld
dataset: meld
modality: audio

model:
  type: audio_only
  audio_encoder: microsoft/wavlm-base
  freeze_feature_extractor: true
  pooling: mean
  dropout: 0.1
  num_classes: 7

data:
  data_dir: data/meld
  batch_size: 8
  max_audio_seconds: 8.0

trainer:
  max_epochs: 10
  accumulate_grad_batches: 2

optimizer:
  # Lower than the default 1e-4: that's the SSL *pre-training* LR and tends to
  # diverge on small fine-tuning runs (see results/results.md "LR=1e-4 cautionary tale").
  lr: 2.0e-5

loss:
  use_class_weights: true   # MELD is dominated by `neutral` (~48%)
