defaults: [base]

experiment_name: audio_only_meld
dataset: meld
modality: audio

model:
  type: audio_only
  audio_encoder: microsoft/wavlm-base
  freeze_feature_extractor: true
  pooling: mean
  dropout: 0.1
  num_classes: 7

data:
  data_dir: data/meld
  batch_size: 8
  max_audio_seconds: 8.0

trainer:
  max_epochs: 10
  accumulate_grad_batches: 2

optimizer:
  lr: 1.0e-4

loss:
  use_class_weights: true
