defaults: [base]

experiment_name: multimodal_ravdess
dataset: ravdess
modality: multimodal

model:
  type: multimodal
  text_encoder: roberta-base
  audio_encoder: facebook/wav2vec2-base
  fusion: cross_attention   # one of: concat, gated, cross_attention
  fusion_hidden: 512
  num_attention_heads: 8
  freeze_feature_extractor: true
  dropout: 0.2
  num_classes: 8

data:
  data_dir: data/ravdess
  split_seed: 42
  test_size: 0.2
  val_size: 0.1
  batch_size: 8
  max_audio_seconds: 5.0
  max_text_tokens: 64

trainer:
  max_epochs: 20
  accumulate_grad_batches: 2

optimizer:
  lr: 5.0e-5
