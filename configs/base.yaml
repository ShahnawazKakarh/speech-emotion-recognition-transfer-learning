# Base configuration — other configs override these defaults
seed: 42

trainer:
  max_epochs: 10
  accelerator: auto
  devices: auto
  # 32-true works everywhere; switch to "16-mixed" (CUDA) or "bf16-mixed" (Apple Silicon
  # on torch >=2.4) only after you've verified a fast-dev-run succeeds.
  precision: 32-true
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 20
  val_check_interval: 1.0

optimizer:
  name: adamw
  lr: 2.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  name: linear_warmup
  warmup_ratio: 0.1

data:
  batch_size: 16
  num_workers: 4
  sample_rate: 16000
  max_audio_seconds: 8.0
  max_text_tokens: 128

logging:
  output_dir: outputs
  use_wandb: false
  wandb_project: ser-transfer-learning
