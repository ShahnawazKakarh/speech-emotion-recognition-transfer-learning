defaults: [base]

experiment_name: multimodal_meld
dataset: meld
modality: multimodal

model:
  type: multimodal
  text_encoder: roberta-base
  audio_encoder: microsoft/wavlm-base
  fusion: cross_attention
  fusion_hidden: 512
  num_attention_heads: 8
  freeze_feature_extractor: true
  dropout: 0.2
  num_classes: 7

data:
  data_dir: data/meld
  use_context: true
  context_window: 2
  batch_size: 8
  max_audio_seconds: 8.0
  max_text_tokens: 128

trainer:
  max_epochs: 10
  accumulate_grad_batches: 2

optimizer:
  lr: 5.0e-5

loss:
  use_class_weights: true
