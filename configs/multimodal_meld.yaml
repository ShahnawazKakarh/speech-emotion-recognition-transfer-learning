defaults: [base]

experiment_name: multimodal_meld
dataset: meld
modality: multimodal

model:
  type: multimodal
  text_encoder: roberta-base
  audio_encoder: microsoft/wavlm-base
  fusion: cross_attention
  fusion_hidden: 512
  num_attention_heads: 8
  freeze_feature_extractor: true
  dropout: 0.2
  num_classes: 7

data:
  data_dir: data/meld
  use_context: true
  context_window: 2
  # MPS-friendly: batch_size 2 with accumulate 8 = effective batch 16
  # (was 8 with accumulate 2 = effective 16, OOM at ~12GB activation pool)
  batch_size: 2
  max_audio_seconds: 5.0   # was 8.0 — biggest single memory factor on MPS
  max_text_tokens: 96      # was 128 — minor savings

trainer:
  max_epochs: 10
  accumulate_grad_batches: 8

optimizer:
  lr: 5.0e-5

loss:
  use_class_weights: true
