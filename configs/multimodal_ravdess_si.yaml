defaults: [base]

experiment_name: multimodal_ravdess_si
dataset: ravdess
modality: multimodal

model:
  type: multimodal
  text_encoder: roberta-base
  audio_encoder: facebook/wav2vec2-base
  fusion: cross_attention
  fusion_hidden: 512
  num_attention_heads: 8
  freeze_feature_extractor: true
  freeze_encoder_layers: 8
  dropout: 0.2
  num_classes: 8

data:
  data_dir: data/ravdess
  split_strategy: speaker_independent
  test_actors: [21, 22, 23, 24]
  val_actors: [19, 20]
  batch_size: 8
  max_audio_seconds: 5.0
  max_text_tokens: 32

trainer:
  max_epochs: 30
  accumulate_grad_batches: 2

optimizer:
  lr: 2.0e-5
  weight_decay: 0.01

scheduler:
  name: linear_warmup
  warmup_ratio: 0.1

loss:
  use_class_weights: true
