defaults: [base]

# Multilingual audio-only baseline on RAVDESS (speaker-independent).
# Drops in wav2vec2-xls-r-300m (53 languages) in place of wav2vec2-base.
# Purpose: verify XLS-R works in the pipeline, compare English performance
# against wav2vec2-base (audio_only_ravdess_si.yaml WF1 = 0.659).
#
# Note: XLS-R-300M is ~3x larger than wav2vec2-base (300M vs 95M params).
# We freeze more transformer layers (10 of 24) and reduce batch size.

experiment_name: audio_only_xlsr_ravdess_si
dataset: ravdess
modality: audio

model:
  type: audio_only
  audio_encoder: facebook/wav2vec2-xls-r-300m
  freeze_feature_extractor: true
  freeze_encoder_layers: 10     # freeze 10 of 24 layers (vs 8 of 12 for base)
  pooling: mean
  dropout: 0.2
  num_classes: 8

data:
  data_dir: data/ravdess
  split_strategy: speaker_independent
  test_actors: [21, 22, 23, 24]
  val_actors: [19, 20]
  batch_size: 4                 # halved from 8 due to 3x model size
  max_audio_seconds: 5.0
  max_text_tokens: 32           # ignored for audio-only but required by base config

trainer:
  max_epochs: 20
  accumulate_grad_batches: 2    # effective batch 8

optimizer:
  lr: 2.0e-5
  weight_decay: 0.01

scheduler:
  name: linear_warmup
  warmup_ratio: 0.1

loss:
  use_class_weights: true
