name: ✨ Feature request
description: Suggest a new model, dataset, evaluation, or other capability.
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New dataset loader
        - New model / encoder
        - New fusion strategy
        - New training feature (loss, scheduler, etc.)
        - Demo / UI improvement
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What use case does this enable? Why does it matter?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: A rough sketch of the API or implementation. References / papers welcome.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why this one is better.

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you be willing to contribute this?
      options:
        - label: I'd like to submit a PR for this
        - label: I can help review a PR for this
